services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: csl
      POSTGRES_PASSWORD: csl
      POSTGRES_DB: csl
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U csl]
      interval: 2s
      timeout: 2s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://csl:csl@db:5432/csl
      DATA_DIR: /app/data
    volumes: [./data:/app/data]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
