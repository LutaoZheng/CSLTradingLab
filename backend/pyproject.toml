[project]
name = "csl-trading-lab-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20", "httpx>=0.28", "websockets>=14",
  "cryptography>=44", "pydantic-settings>=2.7", "python-multipart>=0.0.20"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28"]
postgres = ["asyncpg>=0.30"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
asyncio_mode = "auto"
